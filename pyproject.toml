[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-mariii"
version = "0.1.0"
description = "Gestor de grupos estudiantiles conectado a Google Sheets"
requires-python = ">=3.11"
dependencies = ["google-auth>=2.29,<3", "requests>=2.31,<3"]

[project.scripts]
agente-mariii = "agente_mariii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
