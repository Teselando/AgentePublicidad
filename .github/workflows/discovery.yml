name: Descubrimiento semanal

on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC = 09:00 en Madrid durante horario de verano.
    # En invierno se ejecuta a las 08:00 de Madrid.
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Buscar y guardar candidatos públicos
        if: env.SPREADSHEET_ID != '' && env.GOOGLE_SERVICE_ACCOUNT_JSON != '' && env.BRAVE_API_KEY != ''
        run: agente-mariii discover --write --limit 30
